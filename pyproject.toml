[project]
name = "piecehunt"
version = "2.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "flask>=3.1.2",
    "httpx[cli]>=0.28.1",
    "requests>=2.32.5",
    "httpx",
    "ultralytics>=8.3.223",
    "dotenv>=0.9.9",
    "pandas>=2.3.3",
    "pymupdf>=1.26.6",
    "sqlacodegen>=3.2.0",
    "psycopg2>=2.9.11",
    "platformdirs>=4.5.1",
    "wxpython>=4.2.4",
    "werkzeug>=3.1.3",
    "pillow>=12.0.0",
    "pylint>=4.0.5",
    "graphviz>=0.21",
    "reportlab>=4.5.1",
    "openpyxl>=3.1.5",
    "supabase>=2.31.0",
]
pythonpath = ["."]

[dependency-groups]
dev = [
    "mkdocs~=1.6",
    "mkdocstrings[python]~=1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff]
line-length = 140

[tool.pytest.ini_options]
pythonpath = ["."]
